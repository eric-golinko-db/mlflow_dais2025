resources:
  jobs:
    deploy:
      name: "${bundle.environment}_deploy_assistant"
      tasks:
        - task_key: agent_eval
          notebook_task:
            notebook_path: ../notebooks/AgentEval.py
        - task_key: register_model
          depends_on:
            - task_key: agent_eval
          notebook_task:
            notebook_path: ../notebooks/RegisterModel.py
            source: WORKSPACE
        - task_key: deploy_model
          depends_on:
            - task_key: register_model
          notebook_task:
            notebook_path: ../notebooks/Deploy.py
            source: WORKSPACE
      queue:
        enabled: true
      parameters:
        - name: catalog
          default: eric_golinko