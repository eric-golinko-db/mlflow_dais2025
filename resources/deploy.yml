resources:
  jobs:
    deploy:
      name: "${bundle.environment}_deploy_assistant"
      tasks:
        - task_key: register_models
          notebook_task:
            notebook_path: ../notebooks/register_model.py
        - task_key: deploy_model
          depends_on:
            - task_key: register_model
          notebook_task:
            notebook_path: ../notebooks/deploy.py
            source: WORKSPACE
      queue:
        enabled: true
      parameters:
        - name: catalog
          default: eric_golinko