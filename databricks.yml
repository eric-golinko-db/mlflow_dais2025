# The name of the bundle. run `databricks bundle schema` to see the full bundle settings schema.
bundle:
  name: mlflow_dais2025


variables:
  target_env:
    description: env deploying to.
    default: dev
  
include:
  # Resources folder contains ML artifact resources for the ML project that defines model and experiment
  # And workflows resources for the ML project including model training -> validation -> deployment,
  # batch inference, quality monitoring, metric refresh, alerts and triggering retrainingd
  - ./resources/deploy.yml

# Deployment Target specific values for workspace
targets:

  dev:
    presets:
      name_prefix: ""
      pipelines_development: true
    default: true  
    workspace: 
      host: "https://e2-dogfood.staging.cloud.databricks.com/"
    permissions:
        - user_name: egolinko@gmail.com
          level: CAN_MANAGE
    variables:
        target_env: "dev"

  qa:
    presets:
      name_prefix: ""
      pipelines_development: true
    workspace: 
      host: "https://e2-dogfood.staging.cloud.databricks.com/"
    permissions:
        - user_name: egolinko@gmail.com
          level: CAN_MANAGE
    variables:
        target_env: "qa"

  staging:
    presets:
      name_prefix: ""
      pipelines_development: true
    workspace: 
      host: "https://e2-dogfood.staging.cloud.databricks.com/"
    permissions:
        - user_name: egolinko@gmail.com
          level: CAN_MANAGE
    variables:
        target_env: "staging"
    
  prod:
    presets:
      name_prefix: ""
      pipelines_development: true
    workspace: 
      host: "https://e2-dogfood.staging.cloud.databricks.com/"
    permissions:
        - user_name: egolinko@gmail.com
          level: CAN_MANAGE
    variables:
        target_env: "prod"